<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Admin Dashboard</title>
<style>
body { font-family: Arial; margin: 20px; }
form { margin-bottom: 20px; }
input, textarea { display: block; margin: 10px 0; width: 300px; padding: 5px; }
button { padding: 5px 10px; cursor: pointer; }
#status { margin-top: 10px; color: green; }
#status.error { color: red; }
#postForm { display: none; margin-top: 20px; }
</style>
</head>
<body>

<h2>Admin Login</h2>

<form id="loginForm">
  <input type="text" name="username" placeholder="Username" required />
  <input type="password" name="password" placeholder="Password" required />
  <button type="button" id="loginBtn">Login</button>
</form>

<div id="status"></div>

<div id="postForm">
  <h2>Posts Section</h2>
  <p>Welcome! You are logged in.</p>
  <button id="logoutBtn">Logout</button>
</div>

<script>
const API_URL = "https://cms.zedtopvibes.workers.dev/login";
let token = localStorage.getItem("sessionToken") || "";

// ===== Auto-login if token exists =====
window.addEventListener("DOMContentLoaded", () => {
  if(token){
    document.getElementById("loginForm").style.display = "none";
    document.getElementById("postForm").style.display = "block";
    document.getElementById("status").innerText = "Session restored.";
  }
});

// ===== Login Button Click =====
document.getElementById("loginBtn").addEventListener("click", async () => {
  const form = document.getElementById("loginForm");
  const statusEl = document.getElementById("status");
  const loginBtn = document.getElementById("loginBtn");

  const data = {
    username: form.username.value,
    password: form.password.value
  };

  statusEl.innerText = "Logging in...";
  statusEl.classList.remove("error");
  loginBtn.disabled = true;

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (result.success) {
      token = result.token;
      localStorage.setItem("sessionToken", token);

      statusEl.innerText = "Login successful!";
      form.style.display = "none";
      document.getElementById("postForm").style.display = "block";
    } else {
      statusEl.innerText = "Login failed: " + result.message;
      statusEl.classList.add("error");
    }
  } catch(err) {
    statusEl.innerText = "Login error: " + err.message;
    statusEl.classList.add("error");
  } finally {
    loginBtn.disabled = false;
  }
});

// ===== Logout Button =====
document.getElementById("logoutBtn").addEventListener("click", () => {
  token = "";
  localStorage.removeItem("sessionToken");
  document.getElementById("postForm").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
  const statusEl = document.getElementById("status");
  statusEl.innerText = "Logged out successfully.";
  statusEl.classList.remove("error");
});
</script>

</body>
</html>
