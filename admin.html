<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Admin Dashboard</title>
<style>
body { font-family: Arial; margin: 20px; }
h2 { margin-top: 30px; }
form { margin-bottom: 20px; }
input, textarea, select { display: block; margin: 5px 0 15px 0; padding: 5px; width: 300px; }
button { padding: 5px 10px; margin-top: 5px; }
#status { margin-top: 10px; color: green; }
#status.error { color: red; }
.section { border-top: 1px solid #ccc; padding-top: 20px; margin-top: 20px; }
.list-item { margin-bottom: 10px; }
.list-item button { margin-left: 10px; }
</style>
</head>
<body>

<h2>Admin Login</h2>

<form id="loginForm">
  <input type="text" name="username" placeholder="Username" required />
  <input type="password" name="password" placeholder="Password" required />
  <button type="button" id="loginBtn">Login</button>
</form>

<div id="status"></div>

<div id="adminDashboard" style="display:none;">

  <button id="logoutBtn">Logout</button>

  <!-- ===== ARTISTS SECTION ===== -->
  <div class="section" id="artistsSection">
    <h2>Artists</h2>
    <form id="artistForm">
      <input type="text" name="name" placeholder="Artist Name" required />
      <textarea name="bio" placeholder="Artist Bio"></textarea>
      <button type="button" id="addArtistBtn">Add Artist</button>
    </form>
    <div id="artistsList"></div>
  </div>

  <!-- ===== ALBUMS SECTION ===== -->
  <div class="section" id="albumsSection">
    <h2>Albums</h2>
    <form id="albumForm">
      <input type="text" name="name" placeholder="Album Name" required />
      <select name="artist_id" required></select>
      <textarea name="description" placeholder="Album Description"></textarea>
      <input type="date" name="release_date" />
      <button type="button" id="addAlbumBtn">Add Album</button>
    </form>
    <div id="albumsList"></div>
  </div>

  <!-- ===== SONGS SECTION ===== -->
  <div class="section" id="songsSection">
    <h2>Songs</h2>
    <form id="songForm">
      <input type="text" name="name" placeholder="Song Name" required />
      <select name="artist_id" required></select>
      <select name="album_id" required></select>
      <input type="number" name="duration" placeholder="Duration in seconds" />
      <input type="text" name="file_url" placeholder="File URL" />
      <button type="button" id="addSongBtn">Add Song</button>
    </form>
    <div id="songsList"></div>
  </div>

</div>

<script>
const WORKER_URL = "https://cms.zedtopvibes.workers.dev";
let token = localStorage.getItem("sessionToken") || "";

// ===== STATUS =====
const statusEl = document.getElementById("status");
const setStatus = (msg, error=false) => {
  statusEl.innerText = msg;
  statusEl.className = error ? "error" : "";
};

// ===== LOGIN =====
document.getElementById("loginBtn").addEventListener("click", async () => {
  const form = document.getElementById("loginForm");
  setStatus("Logging in...");
  try {
    const res = await fetch(`${WORKER_URL}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: form.username.value, password: form.password.value })
    });
    const data = await res.json();
    if (data.success) {
      token = data.token;
      localStorage.setItem("sessionToken", token);
      setStatus("Login successful!");
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("adminDashboard").style.display = "block";
      loadAllData();
    } else setStatus("Login failed: " + data.message, true);
  } catch(err) {
    setStatus("Login error: " + err.message, true);
  }
});

// ===== LOGOUT =====
document.getElementById("logoutBtn").addEventListener("click", () => {
  token = "";
  localStorage.removeItem("sessionToken");
  document.getElementById("adminDashboard").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
  setStatus("Logged out successfully.");
});

// ===== HELPER FETCH =====
const authFetch = async (url, options={}) => {
  options = { ...options };
  options.headers = options.headers || {};
  
  // Automatically attach session token if available
  const storedToken = localStorage.getItem("sessionToken");
  if (storedToken) {
    options.headers["Cookie"] = `zed_session=${storedToken}`;
  }

  // Default content type for JSON
  if (!options.headers["Content-Type"]) {
    options.headers["Content-Type"] = "application/json";
  }

  try {
    const res = await fetch(url, options);
    let data;
    try { data = await res.json(); } 
    catch { data = {}; } // fallback if response is empty
    return { ok: res.ok, status: res.status, data };
  } catch (err) {
    return { ok: false, status: 0, data: { error: err.message } };
  }
};

// ===== ARTISTS =====
const artistsListEl = document.getElementById("artistsList");
const artistForm = document.getElementById("artistForm");
document.getElementById("addArtistBtn").addEventListener("click", async () => {
  const data = {
    name: artistForm.name.value,
    bio: artistForm.bio.value
  };
  const res = await authFetch(`${WORKER_URL}/artists`, { method:"POST", body:JSON.stringify(data) });
  if(res.ok){ artistForm.reset(); loadArtists(); }
  else setStatus(res.data.error,true);
});

const loadArtists = async () => {
  const res = await authFetch(`${WORKER_URL}/artists`);
  if(!res.ok){ setStatus(res.data.error,true); return; }
  const data = Array.isArray(res.data) ? res.data : [];
  artistsListEl.innerHTML = "";
  const artistSelects = document.querySelectorAll("#albumForm select[name='artist_id'], #songForm select[name='artist_id']");
  artistSelects.forEach(s => s.innerHTML = "<option value=''>Select Artist</option>");
  data.forEach(a=>{
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `${a.name} <button onclick="deleteArtist('${a.id}')">Delete</button>`;
    artistsListEl.appendChild(div);
    artistSelects.forEach(s=>{
      const opt = document.createElement("option"); opt.value = a.id; opt.text = a.name; s.appendChild(opt);
    });
  });
};

window.deleteArtist = async (id)=>{
  if(!confirm("Delete artist?")) return;
  const res = await authFetch(`${WORKER_URL}/artists/${id}`, { method:"DELETE" });
  if(res.ok) loadArtists();
  else setStatus(res.data.error,true);
};

// ===== ALBUMS =====
const albumsListEl = document.getElementById("albumsList");
const albumForm = document.getElementById("albumForm");
document.getElementById("addAlbumBtn").addEventListener("click", async () => {
  const data = {
    name: albumForm.name.value,
    artist_id: albumForm.artist_id.value,
    description: albumForm.description.value,
    release_date: albumForm.release_date.value
  };
  const res = await authFetch(`${WORKER_URL}/albums`, { method:"POST", body:JSON.stringify(data) });
  if(res.ok){ albumForm.reset(); loadAlbums(); }
  else setStatus(res.data.error,true);
});

const loadAlbums = async () => {
  const res = await authFetch(`${WORKER_URL}/albums`);
  if(!res.ok){ setStatus(res.data.error,true); return; }
  const data = Array.isArray(res.data) ? res.data : [];
  albumsListEl.innerHTML = "";
  const albumSelect = document.querySelector("#songForm select[name='album_id']");
  albumSelect.innerHTML = "<option value=''>Select Album</option>";
  data.forEach(a=>{
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `${a.name} <button onclick="deleteAlbum('${a.id}')">Delete</button>`;
    albumsListEl.appendChild(div);
    const opt = document.createElement("option"); opt.value = a.id; opt.text = a.name; albumSelect.appendChild(opt);
  });
};

window.deleteAlbum = async (id)=>{
  if(!confirm("Delete album?")) return;
  const res = await authFetch(`${WORKER_URL}/albums/${id}`, { method:"DELETE" });
  if(res.ok) loadAlbums();
  else setStatus(res.data.error,true);
};

// ===== SONGS =====
const songsListEl = document.getElementById("songsList");
const songForm = document.getElementById("songForm");
document.getElementById("addSongBtn").addEventListener("click", async () => {
  const data = {
    name: songForm.name.value,
    artist_id: songForm.artist_id.value,
    album_id: songForm.album_id.value,
    duration: Number(songForm.duration.value),
    file_url: songForm.file_url.value
  };
  const res = await authFetch(`${WORKER_URL}/songs`, { method:"POST", body:JSON.stringify(data) });
  if(res.ok){ songForm.reset(); loadSongs(); }
  else setStatus(res.data.error,true);
});

const loadSongs = async () => {
  const res = await authFetch(`${WORKER_URL}/songs`);
  if(!res.ok){ setStatus(res.data.error,true); return; }
  const data = Array.isArray(res.data) ? res.data : [];
  songsListEl.innerHTML = "";
  data.forEach(s=>{
    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `${s.name} <button onclick="deleteSong('${s.id}')">Delete</button>`;
    songsListEl.appendChild(div);
  });
};

window.deleteSong = async (id)=>{
  if(!confirm("Delete song?")) return;
  const res = await authFetch(`${WORKER_URL}/songs/${id}`, { method:"DELETE" });
  if(res.ok) loadSongs();
  else setStatus(res.data.error,true);
};

// ===== LOAD ALL =====
const loadAllData = ()=>{ loadArtists(); loadAlbums(); loadSongs(); };

if(token){
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("adminDashboard").style.display = "block";
  loadAllData();
}
</script>

</body>
</html>
