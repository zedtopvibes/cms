<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS Admin Dashboard</title>
<style>
body { font-family: Arial; margin: 20px; }
form { margin-bottom: 20px; }
input, select, textarea, button { display: block; margin: 10px 0; width: 300px; padding: 5px; }
button { padding: 5px 10px; }
#status { margin-top: 10px; color: green; }
#status.error { color: red; }
#dashboard { display: none; }
.list-item { margin-bottom: 5px; }
.list-item input, .list-item select { width: 150px; display: inline-block; margin-right: 5px; }
.list-item button { display: inline-block; padding: 3px 6px; }
</style>
</head>
<body>

<h2>Admin Login</h2>

<div id="loginForm">
  <form>
    <input type="text" name="username" placeholder="Username" required />
    <input type="password" name="password" placeholder="Password" required />
    <button type="button" id="loginBtn">Login</button>
  </form>
  <div id="status"></div>
</div>

<div id="dashboard">
  <h2>Dashboard</h2>
  <button id="logoutBtn">Logout</button>

  <h3>Artists</h3>
  <form id="artistForm">
    <input type="text" name="name" placeholder="Artist Name" required />
    <textarea name="bio" placeholder="Artist Bio"></textarea>
    <button type="button" id="addArtistBtn">Add Artist</button>
  </form>
  <div id="artistsList"></div>

  <h3>Albums</h3>
  <form id="albumForm">
    <input type="text" name="name" placeholder="Album Name" required />
    <select name="artist_id" id="albumArtistSelect" required></select>
    <input type="date" name="release_date" placeholder="Release Date" />
    <textarea name="description" placeholder="Description"></textarea>
    <button type="button" id="addAlbumBtn">Add Album</button>
  </form>
  <div id="albumsList"></div>

  <h3>Songs</h3>
  <form id="songForm">
    <input type="text" name="name" placeholder="Song Name" required />
    <select name="artist_id" id="songArtistSelect" required></select>
    <select name="album_id" id="songAlbumSelect" required></select>
    <input type="number" name="duration" placeholder="Duration (seconds)" />
    <input type="text" name="file_url" placeholder="File URL" />
    <button type="button" id="addSongBtn">Add Song</button>
  </form>
  <div id="songsList"></div>
</div>

<script>
const API_BASE = "https://cms.zedtopvibes.workers.dev";
let token = localStorage.getItem("token") || "";

async function authFetch(url, options={}) {
  options.headers = options.headers || {};
  options.headers["Authorization"] = "Bearer " + token;
  options.headers["Content-Type"] = "application/json";
  return fetch(url, options);
}
function setStatus(msg,error=false){ const el=document.getElementById("status"); el.innerText=msg; el.className=error?"error":""; }

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  const form=document.querySelector("#loginForm form");
  const username=form.username.value;
  const password=form.password.value;
  setStatus("Logging in...");
  try{
    const res=await fetch(API_BASE+"/login",{method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username,password})});
    const data=await res.json();
    if(data.success){ token=data.token; localStorage.setItem("token",token); document.getElementById("loginForm").style.display="none"; document.getElementById("dashboard").style.display="block"; setStatus(""); loadArtists(); loadAlbums(); loadSongs(); }
    else setStatus(data.message,true);
  }catch(err){ setStatus(err.message,true); }
});

document.getElementById("logoutBtn").addEventListener("click", ()=>{
  token=""; localStorage.removeItem("token"); document.getElementById("dashboard").style.display="none"; document.getElementById("loginForm").style.display="block"; setStatus("Logged out successfully.");
});

// ===== ARTISTS =====
async function loadArtists(){
  const res=await authFetch(API_BASE+"/artists"); const data=await res.json();
  if(!Array.isArray(data)){ setStatus(data.error||"Error",true); return; }
  const container=document.getElementById("artistsList"); container.innerHTML="";
  const artistSelects=[document.getElementById("albumArtistSelect"),document.getElementById("songArtistSelect")];
  artistSelects.forEach(sel=>sel.innerHTML="<option value=''>Select Artist</option>");
  data.forEach(a=>{
    const div=document.createElement("div"); div.className="list-item";
    div.innerHTML=`<input type='text' value='${a.name}' id='artist-name-${a.id}' />
                   <input type='text' value='${a.bio}' id='artist-bio-${a.id}' />
                   <button onclick='editArtist("${a.id}")'>Save</button>
                   <button onclick='deleteArtist("${a.id}")'>Delete</button>`;
    container.appendChild(div);
    artistSelects.forEach(sel=>{ const opt=document.createElement("option"); opt.value=a.id; opt.textContent=a.name; sel.appendChild(opt); });
  });
}
document.getElementById("addArtistBtn").addEventListener("click", async ()=>{
  const form=document.getElementById("artistForm"); const name=form.name.value; const bio=form.bio.value;
  await authFetch(API_BASE+"/artists",{method:"POST", body:JSON.stringify({name,bio})}); form.reset(); loadArtists();
});
async function editArtist(id){ const name=document.getElementById(`artist-name-${id}`).value; const bio=document.getElementById(`artist-bio-${id}`).value; await authFetch(API_BASE+"/artists/"+id,{method:"PUT",body:JSON.stringify({name,bio})}); loadArtists(); }
async function deleteArtist(id){ await authFetch(API_BASE+"/artists/"+id,{method:"DELETE"}); loadArtists(); loadAlbums(); loadSongs(); }

// ===== ALBUMS =====
async function loadAlbums(){
  const res=await authFetch(API_BASE+"/albums"); const data=await res.json();
  if(!Array.isArray(data)){ setStatus(data.error||"Error",true); return; }
  const container=document.getElementById("albumsList"); container.innerHTML="";
  const albumSelect=document.getElementById("songAlbumSelect"); albumSelect.innerHTML="<option value=''>Select Album</option>";
  data.forEach(a=>{
    const div=document.createElement("div"); div.className="list-item";
    div.innerHTML=`<input type='text' value='${a.name}' id='album-name-${a.id}' />
                   <input type='date' value='${a.release_date}' id='album-date-${a.id}' />
                   <input type='text' value='${a.description}' id='album-desc-${a.id}' />
                   <select id='album-artist-${a.id}'></select>
                   <button onclick='editAlbum("${a.id}")'>Save</button>
                   <button onclick='deleteAlbum("${a.id}")'>Delete</button>`;
    container.appendChild(div);
    fetchArtistsForAlbumSelect(a.id);
    const opt=document.createElement("option"); opt.value=a.id; opt.textContent=a.name; albumSelect.appendChild(opt);
  });
}
async function fetchArtistsForAlbumSelect(albumId){
  const res=await authFetch(API_BASE+"/artists"); const data=await res.json();
  const sel=document.getElementById(`album-artist-${albumId}`);
  sel.innerHTML=""; data.forEach(a=>{ const opt=document.createElement("option"); opt.value=a.id; opt.textContent=a.name; sel.appendChild(opt); });
}
document.getElementById("addAlbumBtn").addEventListener("click", async ()=>{
  const form=document.getElementById("albumForm"); const name=form.name.value; const artist_id=form.artist_id.value; const release_date=form.release_date.value; const description=form.description.value;
  if(!artist_id){ setStatus("Select artist",true); return; }
  await authFetch(API_BASE+"/albums",{method:"POST",body:JSON.stringify({name,artist_id,release_date,description})}); form.reset(); loadAlbums();
});
async function editAlbum(id){
  const name=document.getElementById(`album-name-${id}`).value; const release_date=document.getElementById(`album-date-${id}`).value;
  const description=document.getElementById(`album-desc-${id}`).value; const artist_id=document.getElementById(`album-artist-${id}`).value;
  await authFetch(API_BASE+"/albums/"+id,{method:"PUT",body:JSON.stringify({name,release_date,description,artist_id})}); loadAlbums(); loadSongs();
}
async function deleteAlbum(id){ await authFetch(API_BASE+"/albums/"+id,{method:"DELETE"}); loadAlbums(); loadSongs(); }

// ===== SONGS =====
async function loadSongs(){
  const res=await authFetch(API_BASE+"/songs"); const data=await res.json();
  if(!Array.isArray(data)){ setStatus(data.error||"Error",true); return; }
  const container=document.getElementById("songsList"); container.innerHTML="";
  const albumSelect=document.getElementById("songAlbumSelect"); albumSelect.innerHTML="<option value=''>Select Album</option>";
  data.forEach(s=>{
    const div=document.createElement("div"); div.className="list-item";
    div.innerHTML=`<input type='text' value='${s.name}' id='song-name-${s.id}' />
                   <input type='number' value='${s.duration}' id='song-duration-${s.id}' />
                   <input type='text' value='${s.file_url}' id='song-file-${s.id}' />
                   <select id='song-artist-${s.id}'></select>
                   <select id='song-album-${s.id}'></select>
                   <button onclick='editSong("${s.id}")'>Save</button>
                   <button onclick='deleteSong("${s.id}")'>Delete</button>`;
    container.appendChild(div);
    fetchArtistsForSongSelect(s.id); fetchAlbumsForSongSelect(s.id);
    const opt=document.createElement("option"); opt.value=s.album_id; opt.textContent=s.name; albumSelect.appendChild(opt);
  });
}
async function fetchArtistsForSongSelect(songId){
  const res=await authFetch(API_BASE+"/artists"); const data=await res.json();
  const sel=document.getElementById(`song-artist-${songId}`);
  sel.innerHTML=""; data.forEach(a=>{ const opt=document.createElement("option"); opt.value=a.id; opt.textContent=a.name; sel.appendChild(opt); });
}
async function fetchAlbumsForSongSelect(songId){
  const res=await authFetch(API_BASE+"/albums"); const data=await res.json();
  const sel=document.getElementById(`song-album-${songId}`);
  sel.innerHTML=""; data.forEach(a=>{ const opt=document.createElement("option"); opt.value=a.id; opt.textContent=a.name; sel.appendChild(opt); });
}
document.getElementById("addSongBtn").addEventListener("click", async ()=>{
  const form=document.getElementById("songForm"); const name=form.name.value; const artist_id=form.artist_id.value; const album_id=form.album_id.value;
  const duration=parseInt(form.duration.value)||0; const file_url=form.file_url.value;
  if(!artist_id||!album_id){ setStatus("Select artist and album",true); return; }
  await authFetch(API_BASE+"/songs",{method:"POST",body:JSON.stringify({name,artist_id,album_id,duration,file_url})}); form.reset(); loadSongs();
});
async function editSong(id){
  const name=document.getElementById(`song-name-${id}`).value;
  const duration=parseInt(document.getElementById(`song-duration-${id}`).value)||0;
  const file_url=document.getElementById(`song-file-${id}`).value;
  const artist_id=document.getElementById(`song-artist-${id}`).value;
  const album_id=document.getElementById(`song-album-${id}`).value;
  await authFetch(API_BASE+"/songs/"+id,{method:"PUT",body:JSON.stringify({name,duration,file_url,artist_id,album_id})}); loadSongs();
}
async function deleteSong(id){ await authFetch(API_BASE+"/songs/"+id,{method:"DELETE"}); loadSongs(); }
</script>

</body>
</html>
