<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedTopVibes Demo Site</title>
<style>
  * { box-sizing: border-box; max-width: 100%; }
  body { margin:0; font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f6f7f7; color:#1d2327; overflow-x:hidden; }
  a { text-decoration:none; color:inherit; }
  button { background:none; border:none; cursor:pointer; font-size:1rem; }

  /* TOPBAR */
  .topbar { height:48px; background:#fff; border-bottom:1px solid #dcdcde; display:flex; align-items:center; justify-content:space-between; padding:0 1rem; position:fixed; top:0; left:0; right:0; z-index:1000; }
  .topbar .title { font-weight:600; font-size:0.95rem; }
  .topbar button { padding:0.3rem 0.5rem; border-radius:4px; background:#2271b1; color:#fff; }

  /* SIDEBAR */
  .sidebar { width:220px; background:#1d2327; color:#fff; position:fixed; top:48px; bottom:0; left:0; padding:1rem 0; overflow-y:auto; }
  .sidebar nav a { display:block; padding:0.6rem 1.2rem; font-size:0.9rem; color:#c3c4c7; }
  .sidebar nav a.active, .sidebar nav a:hover { background:#2271b1; color:#fff; }

  /* MAIN */
  .main { margin-left:220px; padding:1.5rem; padding-top:64px; min-height:100vh; }
  .page-title { font-size:1.4rem; font-weight:600; margin-bottom:1rem; }
  .content-panel { background:#fff; border:1px solid #dcdcde; padding:1.5rem; min-height:300px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap:1rem; }
  .card { background:#fff; border:1px solid #dcdcde; padding:1rem; border-radius:5px; text-align:center; cursor:pointer; }
  .card img { width:100%; height:150px; object-fit:cover; border-radius:4px; margin-bottom:0.5rem; }
  .audio-player { width:100%; margin-top:0.5rem; }

  @media (max-width:768px){
    .sidebar { transform:translateX(-100%); transition:transform 0.25s ease; z-index:999; }
    .sidebar.open { transform:translateX(0); }
    .main { margin-left:0; padding:1rem; padding-top:64px; }
  }

  /* Dark mode */
  body.dark-mode { background:#121212; color:#f0f0f0; }
  body.dark-mode .topbar { background:#1e1e1e; border-bottom:1px solid #333; }
  body.dark-mode .sidebar { background:#1b1b1b; color:#ddd; }
  body.dark-mode .sidebar nav a { color:#ccc; }
  body.dark-mode .sidebar nav a.active, body.dark-mode .sidebar nav a:hover { background:#337ab7; color:#fff; }
  body.dark-mode .main .content-panel { background:#1e1e1e; border:1px solid #333; }
  body.dark-mode .card { background:#1e1e1e; border:1px solid #333; color:#fff; }
</style>
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="title">ZedTopVibes Demo</div>
  <button id="themeToggleBtn">🌙</button>
</header>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <nav>
    <a href="#" class="active" onclick="setPage('Home', this)">Home</a>
    <a href="#" onclick="setPage('Artists', this)">Artists</a>
    <a href="#" onclick="setPage('Albums', this)">Albums</a>
    <a href="#" onclick="setPage('Songs', this)">Songs</a>
  </nav>
</aside>

<!-- MAIN -->
<main class="main">
  <h1 class="page-title" id="pageTitle">Home</h1>
  <div class="content-panel">
    <div id="panel-Home"><p>Welcome to the ZedTopVibes Demo Site!</p></div>
    <div id="panel-Artists" style="display:none;"><div class="grid" id="artistsGrid"><p>Loading...</p></div></div>
    <div id="panel-Albums" style="display:none;"><div class="grid" id="albumsGrid"><p>Loading...</p></div></div>
    <div id="panel-Songs" style="display:none;"><div class="grid" id="songsGrid"><p>Loading...</p></div></div>
  </div>
</main>

<script>
const BASE_API = "https://cms.zedtopvibes.workers.dev"; // backend API

function setPage(title, el){
  document.getElementById("pageTitle").textContent = title;
  document.querySelectorAll(".sidebar a").forEach(a=>a.classList.remove("active"));
  if(el) el.classList.add("active");
  document.querySelectorAll('.content-panel > div').forEach(panel=>panel.style.display='none');
  const panel = document.getElementById('panel-'+title);
  if(panel) panel.style.display='block';

  if(title==="Artists") fetchData("/api/artists","artistsGrid",showAlbumsByArtist);
  if(title==="Albums") fetchData("/api/albums","albumsGrid",showSongsByAlbum);
  if(title==="Songs") fetchData("/api/songs","songsGrid",showSongCard);
}

// Fetch data from backend
async function fetchData(endpoint, gridId, clickCallback){
  const grid = document.getElementById(gridId);
  grid.innerHTML = "<p>Loading...</p>";
  try{
    const res = await fetch(BASE_API+endpoint);
    const data = await res.json();
    if(!data.length){ grid.innerHTML="<p>No items found.</p>"; return; }

    grid.innerHTML = "";
    data.forEach(item=>{
      const card = document.createElement("div");
      card.className="card";
      card.innerHTML=`${item.image?`<img src="${item.image}" alt="${item.name}">`:''}<p>${item.name}</p>`;
      if(clickCallback) card.onclick=()=>clickCallback(item);
      grid.appendChild(card);
    });
  }catch(err){
    grid.innerHTML=`<p style="color:red">Error: ${err.message}</p>`;
  }
}

// Show albums by artist
function showAlbumsByArtist(artist){
  setPage('Albums');
  fetchData(`/api/albums?artistId=${artist.id}`,"albumsGrid",showSongsByAlbum);
}

// Show songs by album
function showSongsByAlbum(album){
  setPage('Songs');
  fetchData(`/api/songs?albumId=${album.id}`,"songsGrid",showSongCard);
}

// Song card with player
function showSongCard(song){
  const panel = document.getElementById('songsGrid');
  panel.innerHTML = "";
  const card = document.createElement("div");
  card.className="card";
  card.innerHTML=`${song.image?`<img src="${song.image}" alt="${song.name}">`:''}
                 <p>${song.name}</p>
                 ${song.url?`<audio class="audio-player" controls src="${song.url}"></audio>`:''}`;
  panel.appendChild(card);
}

// Theme toggle
document.getElementById('themeToggleBtn').onclick=()=>document.body.classList.toggle('dark-mode');
</script>

</body>
</html>
