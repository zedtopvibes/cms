<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Manager</title>

<style>
:root {
  --bg: #0f172a;
  --card: #111827;
  --accent: #38bdf8;
  --text: #e5e7eb;
  --danger: #ef4444;
  --border: #1f2937;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  background: #020617;
  padding: 16px;
  font-size: 18px;
  font-weight: 700;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.card {
  background: var(--card);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}

.upload-box {
  border: 2px dashed #334155;
  padding: 28px;
  border-radius: 14px;
  text-align: center;
  cursor: pointer;
}

.upload-box:hover {
  border-color: var(--accent);
}

.upload-box p {
  margin: 0 0 10px;
  opacity: 0.85;
}

input[type=file] {
  display: none;
}

button {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}

button.danger {
  background: var(--danger);
  color: #fff;
}

.file {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}

.file:last-child {
  border-bottom: none;
}

.file small {
  opacity: 0.7;
}

.actions button {
  margin-left: 6px;
}

.upload-item {
  margin-top: 12px;
}

.upload-item strong {
  display: block;
  margin-bottom: 4px;
}

.progress {
  width: 100%;
  height: 8px;
  background: #1f2937;
  border-radius: 999px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.15s;
}

.upload-item small {
  opacity: 0.7;
}

.error {
  color: var(--danger);
  margin-top: 8px;
  font-size: 14px;
}
</style>
</head>

<body>

<header>📁 Media Manager</header>

<div class="container">

  <!-- Upload Card -->
  <div class="card">
    <label class="upload-box">
      <input
        type="file"
        id="files"
        multiple
        accept=".jpg,.png,.pdf,.zip,.mp4,.mp3"
      >
      <p>Drag & drop files here<br>or click to select</p>
      <button>Select Files</button>
    </label>
    <div id="error" class="error"></div>
  </div>

  <!-- File List -->
  <div class="card">
    <h3>Uploaded Files</h3>
    <div id="list"></div>
  </div>

</div>

<script>
const API = "https://cms.zedtopvibes.workers.dev";
const ALLOWED_EXT = ["jpg","png","pdf","zip","mp4","mp3"];

const listEl = document.getElementById("list");
const fileInput = document.getElementById("files");
const errorBox = document.getElementById("error");

/* =========================
   FILE PREVIEW HELPER
========================= */
function previewFile(fileName) {
  const ext = fileName.split('.').pop().toLowerCase();
  const previewable = ["jpg","png","pdf","mp4","mp3"];
  if (!previewable.includes(ext)) return null;

  const url = `${API}/${fileName}`;
  switch(ext) {
    case "jpg":
    case "png":
      return `<img src="${url}" style="max-width:150px; border-radius:8px; margin-top:6px;">`;
    case "pdf":
      return `<a href="${url}" target="_blank">📄 View PDF</a>`;
    case "mp4":
      return `<video controls width="200" style="margin-top:6px;"><source src="${url}" type="video/mp4">Your browser does not support video.</video>`;
    case "mp3":
      return `<audio controls style="margin-top:6px;"><source src="${url}" type="audio/mpeg">Your browser does not support audio.</audio>`;
    default:
      return null;
  }
}

/* =========================
   LOAD FILES
========================= */
async function loadFiles() {
  listEl.innerHTML = "Loading...";
  const res = await fetch(API + "/files");
  const files = await res.json();
  listEl.innerHTML = "";

  if (!files.length) {
    listEl.innerHTML = "<p>No files uploaded</p>";
    return;
  }

  files.forEach(f => {
    const div = document.createElement("div");
    div.className = "file";

    const previewHTML = previewFile(f.key) || '';

    div.innerHTML = `
      <div>
        <strong>${f.key}</strong><br>
        <small>${(f.size / 1024).toFixed(1)} KB</small><br>
        ${previewHTML}
      </div>
      <div class="actions">
        <a href="${API}/${f.key}" target="_blank">
          <button>View</button>
        </a>
        <button class="danger" onclick="deleteFile('${f.key}')">Delete</button>
      </div>
    `;
    listEl.appendChild(div);
  });
}

/* =========================
   FILE VALIDATION
========================= */
function isAllowed(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  return ALLOWED_EXT.includes(ext);
}

/* =========================
   UPLOAD WITH PER-FILE PROGRESS
========================= */
fileInput.onchange = () => {
  errorBox.textContent = "";
  const files = [...fileInput.files];
  if (!files.length) return;

  const uploadCard = document.createElement("div");
  uploadCard.className = "card";
  uploadCard.innerHTML = "<h3>Uploading files…</h3>";
  document.querySelector(".container").prepend(uploadCard);

  files.forEach(file => {
    if (!isAllowed(file)) {
      errorBox.textContent =
        "Only JPG, PNG, PDF, ZIP, MP4 and MP3 files are allowed.";
      return;
    }
    uploadFile(file, uploadCard);
  });

  fileInput.value = "";
};

function uploadFile(file, container) {
  const item = document.createElement("div");
  item.className = "upload-item";
  item.innerHTML = `
    <strong>${file.name}</strong>
    <div class="progress"><span></span></div>
    <small>0%</small>
  `;
  container.appendChild(item);

  const bar = item.querySelector("span");
  const text = item.querySelector("small");

  const form = new FormData();
  form.append("files", file);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", API + "/upload");

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const percent = Math.round((e.loaded / e.total) * 100);
      bar.style.width = percent + "%";
      text.textContent = percent + "%";
    }
  };

  xhr.onload = () => {
    bar.style.width = "100%";
    text.textContent = "Completed";
    setTimeout(() => item.remove(), 1200);
    loadFiles();
  };

  xhr.onerror = () => {
    bar.style.background = "#ef4444";
    text.textContent = "Failed";
  };

  xhr.send(form);
}

/* =========================
   DELETE FILE
========================= */
async function deleteFile(name) {
  if (!confirm("Delete this file?")) return;

  await fetch(API + "/delete", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  });

  loadFiles();
}

loadFiles();
</script>

</body>
</html>
