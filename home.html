<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZedTopVibes Demo</title>
<style>
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin:0; background:#f6f7f7; color:#1d2327; }
  h1,h2,h3 { margin:0.5rem 0; }
  .container { max-width:1200px; margin:auto; padding:1rem; }
  .grid { display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); }
  .card { background:#fff; border:1px solid #dcdcde; border-radius:5px; overflow:hidden; text-align:center; padding:0.5rem; }
  .card img { width:100%; height:150px; object-fit:cover; }
  a { text-decoration:none; color:#2271b1; }
  .section { margin-bottom:2rem; }
</style>
</head>
<body>

<div class="container">
  <h1>ZedTopVibes Demo</h1>

  <div class="section" id="artistsSection">
    <h2>Artists</h2>
    <div class="grid" id="artistsGrid"></div>
  </div>

  <div class="section" id="albumsSection">
    <h2>Albums</h2>
    <div class="grid" id="albumsGrid"></div>
  </div>

  <div class="section" id="songsSection">
    <h2>Songs</h2>
    <div class="grid" id="songsGrid"></div>
  </div>
</div>

<script>
const API_BASE = "https://cms.zedtopvibes.workers.dev";

// Replace this with your actual session token if needed
const sessionToken = ""; // optional if you allow public demo

async function fetchData(endpoint) {
  try {
    const res = await fetch(API_BASE + endpoint, {
      headers: sessionToken ? { "Authorization": "Bearer " + sessionToken } : {}
    });
    return await res.json();
  } catch(err) {
    console.error("Error fetching", endpoint, err);
    return [];
  }
}

async function renderDemo() {
  const [artists, albums, songs] = await Promise.all([
    fetchData("/artists"),
    fetchData("/albums"),
    fetchData("/songs")
  ]);

  // ===== Render Artists =====
  const artistsGrid = document.getElementById("artistsGrid");
  artists.forEach(a => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${a.image}" alt="${a.name}" /><h3>${a.name}</h3>`;
    artistsGrid.appendChild(div);
  });

  // ===== Render Albums =====
  const albumsGrid = document.getElementById("albumsGrid");
  albums.forEach(a => {
    const artistName = artists.find(ar => ar.id === a.artistId)?.name || "Unknown";
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<img src="${a.cover}" alt="${a.title}" /><h3>${a.title}</h3><p>${artistName}</p>`;
    albumsGrid.appendChild(div);
  });

  // ===== Render Songs =====
  const songsGrid = document.getElementById("songsGrid");
  songs.forEach(s => {
    const artistName = artists.find(ar => ar.id === s.artistId)?.name || "Unknown";
    const albumTitle = albums.find(al => al.id === s.albumId)?.title || "Unknown Album";
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `<h3>${s.title}</h3><p>${artistName}</p><p>${albumTitle}</p><audio controls src="${s.url}"></audio>`;
    songsGrid.appendChild(div);
  });
}

// Initialize demo
renderDemo();
</script>

</body>
</html>
