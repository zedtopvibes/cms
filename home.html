<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Manager</title>

<style>
:root {
  --bg: #0f172a;
  --card: #111827;
  --accent: #38bdf8;
  --text: #e5e7eb;
  --danger: #ef4444;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

header {
  padding: 16px;
  background: #020617;
  font-size: 18px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 16px;
}

.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

.upload-box {
  border: 2px dashed #334155;
  padding: 24px;
  text-align: center;
  border-radius: 12px;
  cursor: pointer;
}

.upload-box:hover {
  border-color: var(--accent);
}

input[type=file] {
  display: none;
}

button {
  background: var(--accent);
  border: none;
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
}

button.danger {
  background: var(--danger);
}

.file {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border-bottom: 1px solid #1f2933;
}

.file small {
  opacity: 0.7;
}

.actions button {
  margin-left: 6px;
}
</style>
</head>

<body>

<header>📁 Media Manager</header>

<div class="container">

  <!-- Upload -->
  <div class="card">
    <label class="upload-box">
      <input type="file" id="files" multiple>
      <p>Drag & drop files here<br>or click to select</p>
      <button>Select Files</button>
    </label>
  </div>

  <!-- Files -->
  <div class="card">
    <h3>Uploaded Files</h3>
    <div id="list"></div>
  </div>

</div>

<script>
const API = "https://cms.zedtopvibes.workers.dev";

const listEl = document.getElementById("list");
const fileInput = document.getElementById("files");

// ===== Load Files =====
async function loadFiles() {
  listEl.innerHTML = "Loading...";
  const res = await fetch(API + "/files");
  const files = await res.json();
  listEl.innerHTML = "";

  if (!files.length) {
    listEl.innerHTML = "<p>No files uploaded</p>";
    return;
  }

  files.forEach(f => {
    const div = document.createElement("div");
    div.className = "file";
    div.innerHTML = `
      <div>
        <strong>${f.key}</strong><br>
        <small>${(f.size / 1024).toFixed(1)} KB</small>
      </div>
      <div class="actions">
        <a href="${API}/${f.key}" target="_blank">
          <button>View</button>
        </a>
        <button class="danger" onclick="del('${f.key}')">Delete</button>
      </div>
    `;
    listEl.appendChild(div);
  });
}

// ===== Upload =====
fileInput.onchange = async () => {
  const form = new FormData();
  for (const file of fileInput.files) {
    form.append("files", file);
  }

  await fetch(API + "/upload", {
    method: "POST",
    body: form,
  });

  fileInput.value = "";
  loadFiles();
};

// ===== Delete =====
async function del(name) {
  if (!confirm("Delete this file?")) return;

  await fetch(API + "/delete", {
    method: "DELETE",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  });

  loadFiles();
}

loadFiles();
</script>

</body>
</html>
